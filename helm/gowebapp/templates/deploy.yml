apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app-container
          image: singampallinandu/gowebpage:{{ .Values.image.tag }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            